<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWH.UBG | Games</title>
    <link rel="icon" href="../uv/hwh-logo.png" type="image/png" id="tabIcon">
    <link rel="stylesheet" href="../assets/css/colors.css" id="css-theme-link">
    <link rel="stylesheet" href="../assets/css/galaxy.css">
    <link rel="stylesheet" href="../assets/css/elements.css">
    <link rel="stylesheet" href="../assets/css/font.css">
    <link rel="stylesheet" href="../assets/icons/fonts/remixicon.css">
    <script src="../assets/js/colors.js"></script>
    <script src="../assets/js/galaxy.js" defer></script>
</head>

<body>

    

    <nav>
        <ul id="nav-ul" class="">
            <div class="container" style="display: flex; flex-direction: row;">
                <div class="top-nav">
                    <li>
                        <a class="active" href="../">
                            <i class="ri ri-home-4-line"></i>
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="../pages/games.html">
                            <i class="ri ri-gamepad-line"></i>
                            Games
                        </a>
                    </li>
                    <li>
                        <a href="../pages/apps.html">
                            <i class="ri ri-apps-line"></i>
                            Apps
                        </a>
                    </li>
                    <li>
                        <a href="../pages/browser.html">
                            <i class="ri ri-seo-line"></i>
                            Browser
                        </a>
                    </li>
                    <li>
                        <a href="../pages/movieframe.html">
                            <i class="ri ri-film-line"></i>
                            Movies
                        </a>
                    </li>
                </div>
                <div>
                    <li>
                        <a href="/?settings=1">
                            <i class="ri ri-settings-3-line"></i>
                            Settings
                        </a>
                    </li>
                </div>
            </div>
        </ul>
    </nav>

    <div class="nav-logo">
        <img src="../uv/hwh-logo.png" alt="HWH.UBG" onclick="
            ul.classList.add('active');
            const blurr = document.createElement('div')
            blurr.classList.add('bluroverlay')
            document.body.append(blurr)
            blurr.addEventListener('click', () => {
                ul.classList.remove('active')
                blurr.remove()
            })
        ">
    </div>

    <style>
        .container {
            display: flex;
        }

        .centerc {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        h1 {
            color: var(--bright-text);
            font-size: 2.5rem;
        }

        .hcenter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .app {
            width: 280px;
            height: 170px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-4);
            margin: 10px;
            transition: 0.3s;
            border: 0px solid white;
            position: relative;
            z-index: 1;
        }

        .app-img {
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            position: relative;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: 0.3s;
        }


        .title {
            z-index: 31;
            transition: 0.2s;
            position: absolute !important;
            left: 15px;
            bottom: -15px;
            opacity: 0;
        }

        .app:hover {
            cursor: pointer;
            outline-offset: 0px;
            scale: 1.05;
        }

        .app:hover .app-img {
            filter: brightness(0.3);
        }

        .app:hover .title {
            bottom: 5px;
            opacity: 1;
        }

        .app h2 {
            color: var(--bright-text);
            position: relative;
            top: 0%;
            transform: translateY(30%);
            font-size: 20px;
        }

        .apps-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            scrollbar-width: none;
        }

        .bottom-glow {
            content: "";
            position: fixed;
            width: 100%;
            height: 35%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.3;
            background: radial-gradient(at bottom, var(--bg-3) 30%, transparent 70%);
        }

        .top-glow {
            content: "";
            position: fixed;
            width: 100%;
            height: 35%;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.3;
            background: radial-gradient(at top, var(--bg-3) 30%, transparent 70%);
        }
    </style>

    <div class="hcenter">
        <h1 style="text-align: center;">Games</h1>
        <input style="margin: 3px;" type="text" placeholder="Search for a game..." onkeyup="searchApps(this.value)">
    </div>

    <div class="apps-container hcenter" style="top: 200px;">
    </div>
    <p class="collection-empty" hidden>No games found.</p>

    <script defer>
        const ul = document.getElementById("nav-ul")

        document.querySelectorAll("li a").forEach(link => {
            link.addEventListener("click", function () {
                document.querySelectorAll("li a").forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });

        window.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "m") {
                console.log("Key pressed")
                e.preventDefault()
                if (!ul.classList.contains("active")) {
                    ul.classList.add("active")
                    const blurr = document.createElement("div")
                    blurr.classList.add("bluroverlay")
                    document.body.append(blurr)
                    blurr.addEventListener("click", () => {
                        blurr.remove()
                        ul.classList.remove("active")
                    })
                } else {
                    ul.classList.remove("active")
                    const blurr = document.querySelector(".bluroverlay")
                    blurr.remove()
                }
            }
        })

        const acont = document.querySelector('.apps-container');
        const imageObserver = "IntersectionObserver" in window
            ? new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const image = entry.target;
                    image.style.backgroundImage = `url("${image.dataset.bg}")`;
                    imageObserver.unobserve(image);
                });
            }, { rootMargin: "200px 0px" })
            : null;
        let games = [];
        let searchTerm = "";
        let renderIndex = 0;

        function renderGamesBatch() {
            const fragment = document.createDocumentFragment();
            const end = Math.min(renderIndex + 40, games.length);

            for (; renderIndex < end; renderIndex += 1) {
                const game = games[renderIndex];
                const card = document.createElement("div");
                card.classList.add("app");
                card.setAttribute("role", "link");
                card.setAttribute("tabindex", "0");
                card.setAttribute("aria-label", `Play ${game.name}`);

                const image = document.createElement("div");
                image.classList.add("app-img");
                image.dataset.bg = game.img;
                if (imageObserver) imageObserver.observe(image);
                else image.style.backgroundImage = `url("${game.img}")`;

                const title = document.createElement("div");
                title.classList.add("title");
                const heading = document.createElement("h2");
                heading.classList.add("h2-title");
                heading.textContent = game.name;
                title.appendChild(heading);
                card.append(image, title);
                card.style.display = game.name.toLowerCase().includes(searchTerm) ? "" : "none";

                const openGame = () => {
                    const query = new URLSearchParams({
                        launch: game.url,
                        name: game.name,
                        img: game.img,
                    });
                    window.location.href = `../pages/play.html?${query}`;
                };
                card.addEventListener("click", openGame);
                card.addEventListener("keydown", event => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openGame();
                    }
                });
                fragment.appendChild(card);
            }

            acont.appendChild(fragment);
            if (renderIndex < games.length) requestAnimationFrame(renderGamesBatch);
        }

        async function loadGames() {
            const selectedStore = localStorage.getItem("cherri_gameStore") || "Classplay";
            const file = selectedStore.toLowerCase() === "gn-math" ? "gn-math" : "classplay";
            const response = await fetch(`../assets/json/${file}.json`);
            if (!response.ok) {
                throw new Error(`Could not load ${file} game data (${response.status})`);
            }

            games = await response.json();
            renderIndex = 0;
            updateEmptyState(games.filter(game => game.name.toLowerCase().includes(searchTerm)).length);
            renderGamesBatch();
        }

        loadGames().catch(error => {
            console.error("Unable to load games:", error);
            document.querySelector(".collection-empty").textContent = "Games could not be loaded.";
            document.querySelector(".collection-empty").hidden = false;
        });

        function searchApps(q) {
            searchTerm = q.trim().toLowerCase();
            acont.querySelectorAll(".app").forEach(card => {
                const matches = card.querySelector(".h2-title").textContent.toLowerCase().includes(searchTerm);
                card.style.display = matches ? "" : "none";
            });
            const totalMatches = games.filter(game => game.name.toLowerCase().includes(searchTerm)).length;
            updateEmptyState(totalMatches);
        }

        function updateEmptyState(visibleCount) {
            const emptyState = document.querySelector(".collection-empty");
            const visible = visibleCount ?? acont.querySelectorAll(".app:not([style*='display: none'])").length;
            emptyState.hidden = visible > 0;
        }
    </script>
</body>

</html>
